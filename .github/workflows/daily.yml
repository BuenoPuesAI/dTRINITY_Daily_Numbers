name: dTRINITY Daily Scrape

on:
  # 8:00 UTC = 3 AM ET (EST) / 4 AM ET (EDT) — accepts the DST 1-hour shift twice/year
  schedule:
    - cron: "0 8 * * *"
  # Lets you trigger a manual run from the Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Bumped from 15 to 180 because main() now sleeps 1hr before each retry
    # (RETRY_DELAY_SECONDS in scraper.py). Worst case: scrape + 1hr + retry + 1hr + retry ≈ 2hr 15min.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scraper.py
